<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>El Tesoro del PGN</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Lora:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--gold:#f2c14e;--ink:#3a2410;--bad:#d64541;--ok:#2f9e63;--t:"Pirata One","Palatino Linotype",Georgia,serif;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:14px 14px 90px;color:#fff;font-family:Lora,Georgia,serif;background:#082635;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% -10%,#1d7a94 0,#0f4a63 45%,#082635 100%)}
.waves{position:fixed;left:-400px;right:0;bottom:0;height:70px;pointer-events:none;opacity:.3;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='70'><path d='M0 35Q50 5 100 35T200 35T300 35T400 35V70H0Z' fill='white'/></svg>") repeat-x;background-size:400px 70px;animation:w 14s linear infinite}
@keyframes w{to{transform:translateX(400px)}}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
@keyframes pulse{50%{box-shadow:0 0 0 12px #ff5a4a33,0 0 22px 6px #ffd15a}}
h1{margin:6px 0 2px;text-align:center;font:400 clamp(34px,6vw,60px) var(--t);color:var(--gold);letter-spacing:2px;text-shadow:0 3px 0 #7a4a12,0 6px 18px #000a}
.sub{text-align:center;opacity:.8;margin:0 0 10px;font-size:15px}
.bar{display:flex;justify-content:space-between;gap:8px;max-width:900px;margin:0 auto 10px;min-height:34px}
.bar span:not(:empty){background:#0006;border:1px solid #f2c14e66;border-radius:20px;padding:5px 14px;font-weight:700;font-size:15px}
.scr{max-width:900px;margin:0 auto;text-align:center;animation:in .45s ease}
.card{background:linear-gradient(160deg,#f9eec9,#ecd699);color:var(--ink);border-radius:20px;padding:clamp(16px,3vw,30px);border:3px solid #8b5a2b;box-shadow:inset 0 0 50px #c9a25a99,0 14px 34px #000a;outline:2px dashed #8b5a2b88;outline-offset:-12px}
.card h2{font:400 36px var(--t);margin:0 0 6px}
label{display:block;margin:14px 0 6px;font-weight:700}
input{width:140px;padding:10px;text-align:center;font:400 34px var(--t);border-radius:14px;border:3px solid #8b5a2b;background:#fffaf0;color:var(--ink)}
button.big{background:linear-gradient(#ffe08a,#e2a82c);color:#3a2410;border:2px solid #8a5a12;border-radius:40px;padding:12px 30px;font:400 24px var(--t);letter-spacing:1px;cursor:pointer;margin:14px 6px 0;box-shadow:0 5px 0 #8a5a12,0 10px 18px #0006;transition:.15s}
button.big:hover:not(:disabled){transform:translateY(-2px)}
button.big:active{transform:translateY(4px);box-shadow:0 1px 0 #8a5a12}
button:disabled{opacity:.55;cursor:default}
#ban,#ban2{min-height:48px;font:400 clamp(26px,4.4vw,42px) var(--t);color:var(--gold);margin-top:12px;text-shadow:0 3px 12px #000a}
.who{font:400 24px var(--t);color:#8a4a12;letter-spacing:1px}
.q{font:700 clamp(19px,3.2vw,28px)/1.3 Lora,Georgia,serif;margin:8px 0 18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;background:#fffaf0;color:var(--ink);border:2px solid #b98b4a;border-radius:14px;padding:12px;font:500 clamp(15px,2.3vw,20px) Lora,Georgia,serif;text-align:left;cursor:pointer;box-shadow:0 4px 0 #b98b4a;transition:.15s}
.opt i{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#ffe08a,#e2a82c);border:2px solid #8a5a12;font:400 22px var(--t);font-style:normal}
.opt:hover:not(:disabled){transform:translateY(-3px);background:#fff0c4;border-color:#8a5a12}
.opt.ok{background:var(--ok);color:#fff;border-color:#1c6a40;box-shadow:0 4px 0 #1c6a40}
.opt.bad{background:var(--bad);color:#fff;border-color:#8a2420;box-shadow:0 4px 0 #8a2420}
#fb{font:400 clamp(26px,4vw,38px) var(--t);margin-top:16px;min-height:44px}

#deco{position:absolute;inset:0;width:100%;height:100%}
.em{position:absolute;transform:translate(-50%,-50%);font-size:clamp(18px,3.8vw,36px);pointer-events:none;z-index:1;filter:drop-shadow(0 3px 2px #0005)}
.bob{animation:bob 3.5s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-62%) rotate(5deg)}}
@keyframes spin{to{rotate:360deg}}

#map{position:relative;width:100%;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:#dcb872;box-shadow:0 0 0 6px #3b2410,0 16px 36px #000b}
#map>svg{position:absolute;inset:0;width:100%;height:100%}
#ov{pointer-events:none;z-index:5}
.pt{position:absolute;z-index:2;transform:translate(-50%,-50%);width:clamp(24px,4.4vw,38px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fdf3d2,#ead29a);border:2px solid #6b4220;color:#4a2a0c;font:400 clamp(13px,2.3vw,22px) var(--t);box-shadow:0 2px 4px #0005;transition:.15s}
.pt.gone{opacity:.25;filter:grayscale(1)}
.pt.on{background:radial-gradient(circle at 35% 30%,#fff2a0,#f2b630);transform:translate(-50%,-50%) scale(1.45);z-index:3;box-shadow:0 0 0 4px #fff6,0 0 18px 6px #ffd15a}
.pt.x{opacity:.4}
.dot{fill:#8a2a1a;transform-box:fill-box;transform-origin:center;animation:dot .25s both}
@keyframes dot{from{opacity:0;transform:scale(0)}}
.xm path{fill:none;stroke:#c0281c;stroke-width:2;stroke-linecap:round;transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.2,1.8,.4,1) both}
.xm circle{fill:none;stroke:#c0281c;stroke-width:.5;transform-box:fill-box;transform-origin:center;animation:ping 1.2s ease-out infinite}
@keyframes pop{from{transform:scale(0) rotate(-120deg)}}
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
@media(max-width:560px){.stage{height:880px}}
.chest{position:relative;flex:none;background:none;border:0;cursor:pointer;color:#fff;font:400 24px var(--t);width:clamp(110px,21vw,200px);margin:0 clamp(3px,1.2vw,12px);transition:all .55s}
.chest svg{width:100%;overflow:visible;display:block;filter:drop-shadow(0 8px 8px #0008)}
.chest:hover:not(:disabled){transform:translateY(-8px) scale(1.05)}
.chests.picked .chest:not(.sel){width:0;margin:0;opacity:0;overflow:hidden;pointer-events:none}
.chests.picked .chest.sel{transform:scale(1.18)}
.chest.shake{animation:shake .55s}
@keyframes shake{20%{transform:scale(1.18) rotate(-5deg)}40%{transform:scale(1.18) rotate(5deg)}60%{transform:scale(1.18) rotate(-4deg)}80%{transform:scale(1.18) rotate(4deg)}}
.chest .rays{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.2);transition:opacity .6s .3s}
.chest.open .rays{opacity:1;animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{from{transform:scale(.8)}to{transform:scale(1.1)}}
.chests.q .rays{opacity:0!important}
.chest .olid,.chest .clid{transform-box:fill-box;transform-origin:center bottom}
.chest .olid{transform:scaleY(0);transition:transform .5s cubic-bezier(.3,1.7,.5,1) .3s}
.chest.open .olid{transform:scaleY(1)}
.chest .clid{transition:transform .3s ease-in}
.chest.open .clid{transform:scaleY(.03)}
.chest .loot{opacity:0;transform-box:fill-box;transform-origin:center bottom;transform:scale(.6);transition:all .6s .45s}
.chest.open .loot{opacity:1;transform:none}
.chest.open .lock{opacity:0}
.sp{position:absolute;left:50%;top:40%;font-size:24px;pointer-events:none;z-index:4;animation:burst 1.3s ease-out forwards}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2) rotate(200deg);opacity:0}}
#qc{position:absolute;top:0;left:0;right:0;margin:0 auto;max-width:760px;z-index:1;opacity:0;pointer-events:none;transform:translateY(320px) scale(.15);transform-origin:50% 100%;transition:all 1s cubic-bezier(.2,1.15,.3,1)}
#qc.show{opacity:1;pointer-events:auto;transform:none}
#qc.front{z-index:3}
.stage{position:relative;height:min(88vh,720px)}
.chests{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:2;display:flex;justify-content:center;align-items:flex-end;transition:top .9s ease,transform .9s ease}
.chests.q{top:100%;transform:translateY(-100%)}
.void{opacity:0}
.chest.empty .void{opacity:1}
.chest.empty .loot,.chest.empty .rays{display:none}
#kk{position:fixed;inset:0;z-index:50;pointer-events:none;background:rgba(4,16,26,0);transition:background .6s;overflow:hidden}
#kk.on{background:rgba(3,12,20,.62)}
#kk.rage{background:rgba(70,3,12,.62)}
#kk>svg,#kg,#kg>svg,#ft,#ft>svg{position:absolute;inset:0;width:100%;height:100%}
#kg{will-change:transform}
#kk .tb{fill:#3b1457;stroke:#0b0212;stroke-width:3;stroke-linejoin:round}
#kk .th{fill:#a46be0;opacity:.3}
#kk .so{fill:#f0b5cf;stroke:#6b1e4a;stroke-width:1}
#kk .si{fill:#7a1f4a}
#kk .hd{fill:url(#kh);stroke:#0b0212;stroke-width:6;stroke-linejoin:round}
#kk .fn{fill:#2a0c42;stroke:#0b0212;stroke-width:5;stroke-linejoin:round}
#kk .hl{fill:#b27be0;opacity:.14}
#kk .sp2{fill:#0b0212;opacity:.3}
#kk .bio{fill:#4de0d0;opacity:.65}
#kk .br{fill:none;stroke:#0b0212;stroke-width:16;stroke-linecap:round}
#kk .ir{fill:url(#ir);stroke:#0b0212;stroke-width:4}
#kk.rage .ir{fill:#ff2a1a}#kk .ir{transition:fill .3s}
#kk .pu{fill:#0b0000}#kk .gl{fill:#fff;opacity:.85}
#kk .bk{fill:#2b1710;stroke:#0b0212;stroke-width:3;stroke-linejoin:round}
#kk .bh{fill:#7a5236;opacity:.5}
#kk .eyes{opacity:0;transition:opacity .7s}#kk.look .eyes{opacity:1}
#kk .maw{transform-box:fill-box;transform-origin:50% 30%;transform:scaleY(.1);opacity:0;transition:transform .9s cubic-bezier(.2,1.4,.4,1),opacity .4s}
#kk.look .maw{transform:none;opacity:1}
#kk .mo{fill:#1c0008;stroke:#0b0212;stroke-width:5;stroke-linejoin:round}
#kk .tt{fill:#efe6cc;stroke:#0b0212;stroke-width:1.5;stroke-linejoin:round}
#kk .ld{fill:#12041c;stroke:#0b0212;stroke-width:3;stroke-linejoin:round}
#kk .sc{fill:none;stroke:#cdb4e6;stroke-width:3;opacity:.55;stroke-linecap:round}
#kk .gp{transform-box:fill-box;opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--r));transition:transform .4s cubic-bezier(.3,1.6,.5,1),opacity .12s}
#kk.grab .gp{opacity:1;transform:none}
#kk .bt{transform-box:fill-box;transform-origin:50% 100%;animation:sw 1.8s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
#kk .arm{transform-box:fill-box;transform-origin:50% 100%;transform:scale(.2) translateY(60px);opacity:0;transition:transform 1s cubic-bezier(.2,1.3,.4,1),opacity .3s}
#kk.grab .arm{transform:none;opacity:1}
#kk .w1{fill:#1a6a86}#kk .w2{fill:#0e4a63}
#kk .wv{animation:wv 3s linear infinite}
@keyframes wv{to{transform:translateX(-120px)}}
#kk .cc{position:absolute;margin:0;transition:none;pointer-events:none}
#kk #ft.sh{animation:cs .25s infinite}
@keyframes cs{25%{transform:translate(-5px,2px) rotate(-3deg)}75%{transform:translate(5px,-2px) rotate(3deg)}}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(prefers-reduced-motion:reduce){#kk .bt,.waves,#kk .wv{animation:none}}
#snd{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:80;width:40px;height:40px;border-radius:50%;border:2px solid #f2c14e88;background:#0008;color:#fff;font-size:18px;cursor:pointer;padding:0}
</style></head><body><button id="snd" aria-label="Activar o silenciar sonido" onclick="SFX.toggle()">🔊</button><div class="waves"></div>
<h1>🗺️ El Tesoro del PGN 🏴‍☠️</h1><p class="sub">Presupuesto General de la Nación · Colombia</p>
<div class="bar"><span id="who2"></span><span id="sc"></span></div>

<section class="scr" id="s0"><div class="card"><h2>¡Zarpemos!</h2>
<p>Cada estudiante tiene un número. El mapa señalará al azar quién abre un cofre y responde.</p>
<label for="n">¿Cuántos estudiantes hay?</label><input id="n" type="number" min="2" max="60" value="20">
<br><button class="big" onclick="start()">¡Zarpar! ⚓</button></div></section>

<section class="scr" id="s1" hidden>
<div id="map"><svg id="deco" viewBox="0 0 160 100"><defs>
<linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d3eddf"/><stop offset=".5" stop-color="#9fd3d0"/><stop offset="1" stop-color="#6fb5be"/></linearGradient>
<radialGradient id="isl"><stop offset="0" stop-color="#7fa95a"/><stop offset=".55" stop-color="#a8c27a"/><stop offset=".85" stop-color="#e9d49b"/><stop offset="1" stop-color="#d7b977"/></radialGradient>
<pattern id="wv" width="12" height="7" patternUnits="userSpaceOnUse"><path d="M0 3.5Q3 .5 6 3.5T12 3.5" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width=".5"/></pattern>
<path id="i1" d="M8 30C6 14 22 6 36 10C52 6 62 18 58 32C64 46 50 58 34 56C18 60 6 48 8 30Z"/>
<path id="i2" d="M70 14C84 4 108 6 118 18C132 20 138 36 128 46C132 60 116 68 100 62C86 70 70 60 72 46C60 36 62 22 70 14Z"/>
<path id="i3" d="M14 70C26 62 44 64 54 72C66 70 80 78 74 88C60 96 36 96 22 90C8 86 6 76 14 70Z"/>
<path id="i4" d="M96 78C108 70 128 72 140 80C150 88 140 96 120 96C104 96 92 90 96 78Z"/></defs>
<rect width="160" height="100" fill="url(#sea)"/><rect width="160" height="100" fill="url(#wv)"/>
<g stroke-linejoin="round"><use href="#i1" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3.5"/><use href="#i1" fill="url(#isl)" stroke="#6b4220" stroke-width=".6"/>
<use href="#i2" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3.5"/><use href="#i2" fill="url(#isl)" stroke="#6b4220" stroke-width=".6"/>
<use href="#i3" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3.5"/><use href="#i3" fill="url(#isl)" stroke="#6b4220" stroke-width=".6"/>
<use href="#i4" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3.5"/><use href="#i4" fill="url(#isl)" stroke="#6b4220" stroke-width=".6"/></g>
<path d="M18 22Q50 70 92 40T146 84" fill="none" stroke="#a8321e" stroke-width=".7" stroke-dasharray="2 1.6" opacity=".8"/>
<path d="M143 81l6 6m0-6l-6 6" stroke="#a8321e" stroke-width="1.4"/></svg>
<span class="em" style="left:9%;top:16%">🌴</span><span class="em" style="left:74%;top:17%">🌴</span><span class="em" style="left:15%;top:80%">🌴</span><span class="em" style="left:89%;top:84%">🌴</span>
<span class="em bob" style="left:47%;top:54%">⛵</span><span class="em" style="left:31%;top:47%">🐋</span><span class="em" style="left:92%;top:42%">🐙</span><span class="em" style="left:60%;top:88%">🏴‍☠️</span><span class="em" style="left:94%;top:9%;font-size:clamp(28px,6vw,54px)">🧭</span></div><div id="ban"></div>
<button class="big" id="go" onclick="spin()">🔎 Buscar al elegido</button>
<button class="big" id="tochest" onclick="chests()" hidden>Elegir cofre</button></section>

<section class="scr" id="s2" hidden>
<div id="ban2"></div><button class="big" id="ne" onclick="next()" hidden>Siguiente turno ➜</button><div class="stage">
<div class="card" id="qc"><div class="who" id="who"></div><div class="q" id="q"></div><div class="opts" id="opts"></div><div id="fb"></div><button class="big" id="nx" onclick="next()" hidden>Siguiente turno ➜</button></div>
<div class="chests" id="ch"></div></div></section>


<section class="scr" id="s4" hidden><div class="card"><h2>🏆 ¡Fin del tesoro!</h2><p id="fin" style="font-size:22px"></p>
<button class="big" onclick="show('s0')">Jugar de nuevo</button></div></section>

<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c0803a"/><stop offset="1" stop-color="#744418"/></linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe58a"/><stop offset="1" stop-color="#d49a22"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#fff2a0"/><stop offset=".5" stop-color="#ffd24a" stop-opacity=".5"/><stop offset="1" stop-color="#ffd24a" stop-opacity="0"/></radialGradient></defs></svg>

<script>
const Q=[
["¿Qué es el PGN?","El plan de ingresos y gastos del Estado para un año","Un banco del Estado","Una ley que crea el Congreso cada mes","Un impuesto que pagan las empresas"],
["¿Entre qué fechas va el año del presupuesto?","1 de enero al 31 de diciembre","1 de julio al 30 de junio","1 de agosto al 31 de julio","1 de marzo al 28 de febrero"],
["¿Cuál es uno de los tres grandes rubros del PGN?","Servicio de la deuda","Turismo","Vacaciones","Exportaciones"],
["¿Qué se paga en el rubro de «servicio de la deuda»?","Capital e intereses","Solo nómina","Las pensiones de todos","Proyectos nuevos de obras"],
["¿Qué rubro financia proyectos para el desarrollo del país?","Inversión","Funcionamiento","Servicio de la deuda","Adición presupuestal"],
["Si el Congreso no aprueba el presupuesto a tiempo, ¿qué pasa?","El Gobierno lo expide por decreto","Se cancela el presupuesto","El país no gasta nada","Lo aprueba la Corte"],
["¿Para qué sirve una ley de financiamiento?","Crea o ajusta impuestos para cubrir el faltante","Reduce el salario de los congresistas","Paga la deuda externa","Cambia la Constitución"],
["¿Cuál fue el primer presupuesto del gobierno Duque?","2019","2015","2023","2026"],
["¿Qué hecho inédito ocurrió con el presupuesto de 2025?","El Congreso lo hundió y el Gobierno lo expidió por decreto","Fue el más pequeño de la historia","No se hizo presupuesto","Lo votó el pueblo"],
["¿Qué presupuesto se está discutiendo para el año 2027?","El proyecto de presupuesto 2027","El presupuesto de 2019","El presupuesto de 2022","El presupuesto de 2023"]];
const $=i=>document.getElementById(i),rnd=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let names,left,qs,score,done,cur,pts,busy;
function show(i){document.querySelectorAll('.scr').forEach(e=>e.hidden=e.id!=i);if(i=='s0'){$('sc').textContent='';$('who2').textContent=''}}
const SFX=(()=>{
 let c,m,rv,nb,amb,muted=false,dc;const R=Math.random;
 const init=()=>{if(!c){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;c=new A();
  m=c.createGain();m.gain.value=muted?0:.7;
  const k=c.createDynamicsCompressor();k.threshold.value=-16;k.knee.value=20;k.ratio.value=5;k.attack.value=.004;k.release.value=.2;
  m.connect(k);k.connect(c.destination);
  nb=c.createBuffer(1,c.sampleRate*3,c.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;
  const L=Math.floor(c.sampleRate*2),ib=c.createBuffer(2,L,c.sampleRate);
  for(let ch=0;ch<2;ch++){const x=ib.getChannelData(ch);for(let i=0;i<L;i++)x[i]=(R()*2-1)*Math.pow(1-i/L,2.8)}
  rv=c.createConvolver();rv.buffer=ib;const rg=c.createGain();rg.gain.value=.55;rv.connect(rg);rg.connect(m);
  const cv=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/512-1;cv[i]=Math.tanh(x*4)}dc=cv}
  if(c.state=='suspended')c.resume()},
 env=(g,t,a,d,v)=>{g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)},
 // cadena de efectos: lp, distorsión, trémolo (am), paneo y envío a reverb
 fx=(n,o,t,dur)=>{
  if(o.lp){const l=c.createBiquadFilter();l.type='lowpass';l.frequency.value=o.lp;n.connect(l);n=l}
  if(o.dist){const w=c.createWaveShaper();w.curve=dc;w.oversample='2x';n.connect(w);n=w}
